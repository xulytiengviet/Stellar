[package]
name = "stellar-vn-anchor"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = "23.0.0"
[dev-dependencies]
soroban-sdk = { version = "23.0.0", features = ["testutils"] }
[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
